<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Live Stream Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.0/dash.all.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --border: #1a1a1a;
    --accent: #34d399;
    --accent2: #00ccff;
    --red: #ff4d6d;
    --text: #e0e0e0;
    --muted: #444;
    --bar-h: 3px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,136,0.015) 2px, rgba(0,255,136,0.015) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  .wrapper {
    width: 100%;
    max-width: 900px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .header-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    animation: blink 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }

  .live-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: 3px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Player Container */
  .player-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 40px rgba(0,255,136,0.05), 0 0 80px rgba(0,0,0,0.8);
  }

  /* Corner accents */
  .player-container::before,
  .player-container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 10;
    pointer-events: none;
  }
  .player-container::before {
    top: 0; left: 0;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .player-container::after {
    bottom: 0; right: 0;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }

  /* Video */
  #videoPlayer {
    width: 100%;
    display: block;
    aspect-ratio: 16/9;
    background: #000;
    outline: none;
  }

  /* iFrame Player */
  #iframePlayer {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border: none;
    display: none;
  }

  /* Spectrum Bar Visualizer */
  .spectrum {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 36px;
    gap: 2px;
    padding: 4px 16px;
    background: #000;
    border-top: 1px solid var(--border);
  }

  .bar {
    width: 4px;
    border-radius: 2px 2px 0 0;
    background: var(--accent);
    min-height: 2px;
    transition: height 0.08s ease;
    box-shadow: 0 0 4px rgba(0,255,136,0.5);
  }

  /* Controls */
  .controls {
    background: #050505;
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    font-size: 14px;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 8px rgba(0,255,136,0.3);
  }
  .ctrl-btn.active {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 8px rgba(255,34,68,0.3);
  }

  .progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .progress-bar {
    width: 100%;
    height: var(--bar-h);
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s linear;
    box-shadow: 0 0 6px rgba(0,255,136,0.6);
  }

  .time-display {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .vol-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .vol-slider {
    -webkit-appearance: none;
    width: 70px;
    height: var(--bar-h);
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 4px rgba(0,255,136,0.8);
    cursor: pointer;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: #000;
    border-top: 1px solid var(--border);
  }

  .status-text {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .status-quality {
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 2px;
  }

  /* URL Box */
  .url-section {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    position: relative;
  }

  .url-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .url-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .url-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .url-row {
    display: flex;
    gap: 8px;
  }

  .url-input {
    flex: 1;
    background: #000;
    border: 1px solid var(--muted);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.5px;
  }
  .url-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(0,255,136,0.15);
  }
  .url-input::placeholder { color: #333; }

  .load-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 9px 18px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .load-btn:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 16px rgba(0,255,136,0.4);
  }

  /* Preset streams */


  /* Beep notification */
  .beep-indicator {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    opacity: 0;
  }
  .beep-indicator.flash {
    animation: beep-flash 0.3s ease-out forwards;
  }
  @keyframes beep-flash {
    0% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(0.5); }
  }

  /* Error overlay */
  .error-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    display: none;
    z-index: 5;
  }
  .error-overlay.show { display: flex; }
  .error-icon { font-size: 28px; }
  .error-msg {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--red);
    letter-spacing: 2px;
  }

  /* Loading overlay */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 4;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Fullscreen */
  #videoPlayer:fullscreen { width: 100vw; height: 100vh; }

  /* ===== Multi-engine player (logo-free / ad-free) ===== */
  #engineHost{display:none;width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
  .engine-ext #engineHost{display:block}
  .engine-ext .spectrum,.engine-ext .controls{display:none}
  #engineHost .video-js,#engineHost media-player,#engineHost media-controller,#engineHost .shaka-c,#engineHost .shaka-c video,#engineHost .plyr,#engineHost .op-player{width:100%;height:100%}
  #engineHost video{background:#000}
  .engine-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .engine-row label{font-size:10px;letter-spacing:2px;color:var(--accent2);text-transform:uppercase}
  .engine-select{flex:1;min-width:180px;background:#000;color:var(--text);border:1px solid var(--muted);border-radius:3px;padding:8px 10px;font-family:inherit;font-size:12px;outline:none}
  .engine-select:focus{border-color:var(--accent)}
  /* ===== THEME v2 — modern violet/cyan, responsive on all devices ===== */
  :root{
    --bg:#0b0d17; --surface:#12162a; --border:#222846; --accent:#8b7bff; --accent2:#22d3ee;
    --red:#ff4d6d; --text:#e8ebf7; --muted:#6b7399; --bar-h:5px; --r:14px;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1000px 500px at 15% -10%,rgba(139,123,255,.18),transparent 60%),
               radial-gradient(900px 500px at 100% 0,rgba(34,211,238,.12),transparent 60%),var(--bg);
    background-attachment:fixed;min-height:100vh;min-height:100dvh;align-items:flex-start;
    padding:clamp(10px,3vw,32px);
    padding-left:max(clamp(10px,3vw,32px),env(safe-area-inset-left));
    padding-right:max(clamp(10px,3vw,32px),env(safe-area-inset-right));
    padding-bottom:max(clamp(10px,3vw,32px),env(safe-area-inset-bottom));
  }
  body::before,.player-container::before,.player-container::after,.url-section::before,.url-label::after{display:none}
  .wrapper{max-width:1100px;margin:0 auto}
  .header{margin-bottom:14px}
  .header-title{font-family:inherit;font-size:clamp(14px,2.2vw,18px);letter-spacing:.5px;font-weight:700;text-transform:none;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .live-label{font-family:inherit;font-size:11px;letter-spacing:1.5px;font-weight:700;background:rgba(255,77,109,.14);padding:3px 9px;border-radius:99px}
  .header span[style]{display:none}
  .player-container,.url-section{border-radius:var(--r);border:1px solid var(--border);background:var(--surface);
    box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .url-section{margin-top:14px;padding:clamp(12px,2.5vw,20px)}
  .player-container{overflow:hidden}
  .spectrum{background:#0d1020;border-top:1px solid var(--border);height:40px;padding:4px 14px}
  .bar{border-radius:3px 3px 0 0;box-shadow:none;background:var(--accent)}
  .controls{background:#0d1020;border-top:1px solid var(--border);padding:10px clamp(10px,2vw,16px);gap:10px}
  .ctrl-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#171c36;color:var(--text);font-size:15px}
  .ctrl-btn:hover{border-color:var(--accent);color:#fff;background:var(--accent);box-shadow:0 4px 16px rgba(139,123,255,.45)}
  .progress-bar{border-radius:99px;height:var(--bar-h)}
  .progress-fill{border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:none}
  .time-display,.status-text,.status-quality{font-family:inherit;font-size:11px;letter-spacing:.3px}
  .time-display,.status-text{color:var(--muted)}
  .status-bar{background:#0d1020;border-top:1px solid var(--border);padding:9px clamp(10px,2vw,16px);gap:10px;flex-wrap:wrap}
  .status-quality{color:var(--accent2);font-weight:600}
  .vol-slider{border-radius:99px;background:var(--border)}
  .vol-slider::-webkit-slider-thumb{width:14px;height:14px;background:var(--accent);box-shadow:none}
  .url-label,.engine-row label{font-family:inherit;font-size:11px;letter-spacing:1.2px;font-weight:600;color:var(--muted)}
  .url-input,.engine-select{background:#0d1020;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
    font-family:inherit;font-size:14px;color:var(--text);min-height:46px}
  .url-input::placeholder{color:#4a5278}
  .url-input:focus,.engine-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,123,255,.2)}
  .load-btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:none;border:0;border-radius:10px;
    padding:0 24px;min-height:46px;color:#fff;background:linear-gradient(135deg,var(--accent),#5b8cff)}
  .load-btn:hover{background:linear-gradient(135deg,#9d8fff,var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(139,123,255,.4)}
  .load-btn:active,.ctrl-btn:active{transform:scale(.97)}
  .engine-select{min-width:0}
  #engineHost,#videoPlayer,#iframePlayer{aspect-ratio:16/9;width:100%}

  /* Tablet */
  @media (max-width:820px){
    .controls{flex-wrap:wrap}
    .progress-wrap{order:5;flex:1 1 100%}
    .vol-wrap{margin-left:auto}
  }
  /* Phone */
  @media (max-width:560px){
    :root{--r:12px}
    .url-row{flex-direction:column}
    .load-btn{width:100%}
    .engine-row{flex-direction:column;align-items:stretch;gap:6px}
    .vol-wrap{display:none}
    .spectrum{height:28px;gap:1px}
    .bar{width:3px}
    .status-bar{flex-direction:column;align-items:flex-start;gap:4px}
  }
  /* Landscape phones: video fills the screen height */
  @media (max-height:480px) and (orientation:landscape){
    body{padding:6px}.header{display:none}
    #engineHost,#videoPlayer,#iframePlayer{max-height:calc(100dvh - 130px);aspect-ratio:auto;height:calc(100dvh - 130px)}
  }
  /* Big screens / TV */
  @media (min-width:1500px){.wrapper{max-width:1320px}.url-input,.engine-select{font-size:16px}}
  /* Touch devices: bigger tap targets */
  @media (pointer:coarse){.ctrl-btn{width:44px;height:44px}.progress-bar{height:8px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="live-dot" id="liveDot"></div>
    <span class="live-label">LIVE</span>
    <span style="color:#1a1a1a">|</span>
    <span class="header-title">Stream Player</span>
  </div>

  <!-- Player -->
  <div class="player-container">
    <div class="beep-indicator" id="beepIndicator"></div>

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
    </div>

    <!-- Error -->
    <div class="error-overlay" id="errorOverlay">
      <div class="error-icon">⚠</div>
      <div class="error-msg" id="errorMsg">SIGNAL LOST</div>
    </div>

    <!-- Video -->
    <video id="videoPlayer" playsinline></video>

    <!-- iFrame Embed Player -->
    <iframe id="iframePlayer"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
    ></iframe>

    <!-- External player engine host -->
    <div id="engineHost"></div>

    <!-- Spectrum Visualizer -->
    <div class="spectrum" id="spectrum"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
      <button class="ctrl-btn" id="stopBtn" onclick="stopStream()" title="Stop">■</button>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display" id="timeDisplay">00:00 / LIVE</div>
      </div>

      <div class="vol-wrap">
        <span style="font-size:12px;color:var(--muted)">🔊</span>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
      </div>

      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute">🔊</button>
      <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <span class="status-text" id="statusText">READY — AWAITING STREAM INPUT</span>
      <span class="status-quality" id="qualityText">HLS / DASH / MP4 / WEBM</span>
    </div>
  </div>

  <!-- URL Box -->
  <div class="url-section">
    <div class="url-label">Stream URL Input</div>
    <div class="engine-row">
      <label for="engineSelect">Player Engine</label>
      <select class="engine-select" id="engineSelect" onchange="onEngineChange()">
        <option value="native">Built-in (Neon · HLS.js / dash.js)</option>
        <option value="videojs">Video.js — HLS · DASH · MP4 + quality menu</option>
        <option value="plyr">Plyr — clean UI · MP4 · HLS quality</option>
        <option value="shaka">Shaka Player — adaptive · DASH · HLS</option>
        <option value="clappr">Clappr — live HLS · level selector</option>
        <option value="vidstack">Vidstack — HLS · WebM · MP4</option>
        <option value="mediachrome">Media Chrome — web components</option>
        <option value="fluid">Fluid Player — MP4 · WebM · HLS</option>
        <option value="openplayer">OpenPlayerJS — light · accessible</option>
      </select>
    </div>
    <div class="url-row">
      <input type="text" class="url-input" id="urlInput"
        placeholder="Paste any URL: .m3u8 · .mpd · .mp4 · embed page (playerado.top/embed2.php?id=...)"
        onkeydown="if(event.key==='Enter')loadStream()">
      <button class="load-btn" onclick="loadStream()">▶ LOAD</button>
    </div>


  </div>

</div>

<script>
  const video = document.getElementById('videoPlayer');
  const iframePlayer = document.getElementById('iframePlayer');
  let hlsInstance = null;
  let dashInstance = null;
  let audioCtx = null;
  let analyser = null;
  let sourceNode = null;
  let specBars = [];
  let animId = null;
  let isMuted = false;
  let isLive = false;
  let isIframeMode = false;

  // Build spectrum bars
  const specEl = document.getElementById('spectrum');
  const NUM_BARS = 60;
  for (let i = 0; i < NUM_BARS; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.height = '3px';
    specEl.appendChild(b);
    specBars.push(b);
  }

  function setStatus(msg, quality) {
    document.getElementById('statusText').textContent = msg;
    if (quality) document.getElementById('qualityText').textContent = quality;
  }

  function showLoading(v) {
    document.getElementById('loadingOverlay').classList.toggle('show', v);
  }
  function showError(msg) {
    const ov = document.getElementById('errorOverlay');
    document.getElementById('errorMsg').textContent = msg || 'SIGNAL LOST';
    ov.classList.add('show');
    showLoading(false);
    setStatus('⚡ ERROR — CHECK URL', '');
    beep(880, 0.3, 'square');
    document.getElementById('liveDot').style.background = '#ff4d6d';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #ff4d6d';
  }
  function hideError() {
    document.getElementById('errorOverlay').classList.remove('show');
  }

  function switchToIframe() {
    video.style.display = 'none';
    iframePlayer.style.display = 'block';
    isIframeMode = true;
    // Hide controls that don't apply to iframe
    document.getElementById('playBtn').style.opacity = '0.3';
    document.getElementById('stopBtn').style.opacity = '1';
    document.getElementById('progressBar').style.opacity = '0.3';
    document.getElementById('volSlider').style.opacity = '0.3';
    document.getElementById('muteBtn').style.opacity = '0.3';
    document.getElementById('timeDisplay').textContent = 'IFRAME EMBED — LIVE';
  }

  function switchToVideo() {
    video.style.display = 'block';
    iframePlayer.style.display = 'none';
    iframePlayer.src = '';
    isIframeMode = false;
    document.getElementById('playBtn').style.opacity = '1';
    document.getElementById('stopBtn').style.opacity = '1';
    document.getElementById('progressBar').style.opacity = '1';
    document.getElementById('volSlider').style.opacity = '1';
    document.getElementById('muteBtn').style.opacity = '1';
  }

  function isEmbedUrl(url) {
    const lower = url.toLowerCase();
    // Detect embed/player page URLs — not direct media files
    const mediaExts = ['.m3u8', '.mpd', '.mp4', '.webm', '.ogg', '.ts', '.mkv', '.avi', '.flv'];
    const isMedia = mediaExts.some(e => lower.includes(e));
    if (isMedia) return false;
    // Detect embed-style paths or known embed patterns
    const embedPatterns = [
      'embed', 'player', '/watch', 'iframe', 'stream.php', 'play.php',
      'live.php', 'index.php', 'channel', '/tv/', '/live/', 'playerado',
      'dailymotion.com/embed', 'youtube.com/embed', 'facebook.com/plugins/video',
      'twitch.tv/embed', 'vimeo.com/video', 'ok.ru/videoembed',
      'streamtape.com', 'streamlare.com', 'doodstream.com/e/',
      'upstream.to', 'mixdrop.co/e/', 'vidlox', 'fembed', 'uqload',
      '.php', '/e/', '/v/'
    ];
    return embedPatterns.some(p => lower.includes(p));
  }

function destroyInstances() {
    destroyEngine();
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (dashInstance) { dashInstance.reset(); dashInstance = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    switchToVideo();
  }

  // ================= MULTI-ENGINE PLAYERS (no logo, no ads) =================
  const host = document.getElementById('engineHost');
  const engineSel = document.getElementById('engineSelect');
  let engineDestroy = null, engineToken = 0;
  try { const e = localStorage.getItem('engine'); if (e) engineSel.value = e; } catch(e){}
  if (!engineSel.value) engineSel.value = 'native';

  const LIBS = {
    videojs: { css:['https://cdn.jsdelivr.net/npm/video.js@8/dist/video-js.min.css','https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@2/dist/videojs-hls-quality-selector.css'],
               js:['https://cdn.jsdelivr.net/npm/video.js@8/dist/video.min.js','https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@4/dist/videojs-contrib-quality-levels.min.js','https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@2/dist/videojs-hls-quality-selector.min.js'] },
    plyr:    { css:['https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css'], js:['https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.min.js'] },
    shaka:   { css:['https://cdn.jsdelivr.net/npm/shaka-player@4/dist/controls.css'], js:['https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.ui.js'] },
    clappr:  { js:['https://cdn.jsdelivr.net/npm/clappr@0.3/dist/clappr.min.js','https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js'] },
    fluid:   { css:['https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css'], js:['https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js'] },
    openplayer:{ css:['https://cdn.jsdelivr.net/npm/openplayerjs@2/dist/openplayer.min.css'], js:['https://cdn.jsdelivr.net/npm/openplayerjs@2/dist/openplayer.min.js'] },
    vidstack:{ css:['https://cdn.vidstack.io/player/theme.css','https://cdn.vidstack.io/player/video.css'], esm:['https://cdn.vidstack.io/player'] },
    mediachrome:{ esm:['https://cdn.jsdelivr.net/npm/media-chrome@4/+esm','https://cdn.jsdelivr.net/npm/hls-video-element@1/+esm','https://cdn.jsdelivr.net/npm/dash-video-element@0.1/+esm'] }
  };
  const loaded = {};
  function loadTag(tag, attrs) {
    const key = attrs.src || attrs.href;
    if (loaded[key]) return loaded[key];
    return loaded[key] = new Promise((res, rej) => {
      const el = document.createElement(tag);
      Object.assign(el, attrs);
      el.onload = res; el.onerror = () => { delete loaded[key]; rej(new Error('LOAD FAIL')); };
      document.head.appendChild(el);
    });
  }
  async function loadLib(name) {
    const L = LIBS[name];
    (L.css || []).forEach(h => loadTag('link', { rel:'stylesheet', href:h }).catch(()=>{}));
    for (const u of (L.js || [])) {
      try { await loadTag('script', { src:u }); }
      catch(e) { if (u === L.js[0]) throw e; } // optional plugins may fail
    }
    for (const u of (L.esm || [])) await import(u).catch(e => { if (u === L.esm[0]) throw e; });
  }

  const MIME = { hls:'application/x-mpegURL', dash:'application/dash+xml', mp4:'video/mp4' };
  function srcType(url) {
    const l = url.toLowerCase();
    return l.includes('m3u8') ? 'hls' : l.includes('.mpd') ? 'dash' : 'mp4';
  }
  function mkVideo(cls) {
    const v = document.createElement('video');
    v.playsInline = true; v.setAttribute('playsinline', '');
    if (cls) v.className = cls;
    return v;
  }

  const BUILD = {
    videojs(url, t) {
      const v = mkVideo('video-js vjs-big-play-centered'); host.appendChild(v);
      const p = videojs(v, { controls:true, autoplay:true, fill:true, preload:'auto' });
      p.src({ src:url, type:MIME[t] });
      try { p.hlsQualitySelector({ displayCurrentQuality:true }); } catch(e){}
      return () => p.dispose();
    },
    plyr(url, t) {
      const v = mkVideo(); v.crossOrigin = 'anonymous'; host.appendChild(v);
      const opt = { autoplay:true, ratio:'16:9', controls:['play-large','play','progress','current-time','mute','volume','settings','pip','fullscreen'], settings:['quality','speed'], i18n:{ qualityLabel:{ 0:'Auto' } } };
      let hls, dash, pl;
      if (t === 'hls' && window.Hls && Hls.isSupported()) {
        hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const hs = [...new Set(hls.levels.map(l => l.height))].sort((a,b)=>b-a);
          opt.quality = { default:0, options:[0, ...hs], forced:true, onChange:q => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); } };
          pl = new Plyr(v, opt); v.play().catch(()=>{});
        });
      } else if (t === 'dash') {
        dash = dashjs.MediaPlayer().create(); dash.initialize(v, url, true); pl = new Plyr(v, opt);
      } else { v.src = url; pl = new Plyr(v, opt); }
      return () => { try{hls&&hls.destroy()}catch(e){} try{dash&&dash.reset()}catch(e){} try{pl&&pl.destroy()}catch(e){} };
    },
    shaka(url) {
      shaka.polyfill.installAll();
      const c = document.createElement('div'); c.className = 'shaka-c'; c.style.position = 'relative';
      const v = mkVideo(); v.autoplay = true; c.appendChild(v); host.appendChild(c);
      const player = new shaka.Player(); const ui = new shaka.ui.Overlay(player, c, v);
      ui.configure({ addBigPlayButton:true });
      player.attach(v).then(() => player.load(url)).catch(e => showError('SHAKA ERROR — ' + (e.code || '')));
      return () => { try{ui.destroy()}catch(e){} };
    },
    clappr(url, t) {
      const p = new Clappr.Player({ source:url, mimeType:MIME[t], parent:host, width:'100%', height:'100%', autoPlay:true, mute:false,
        plugins:(window.LevelSelector ? [LevelSelector] : []), levelSelectorConfig:{ title:'Quality', labels:{ '-1':'Auto' } }, playback:{ playInline:true } });
      return () => p.destroy();
    },
    vidstack(url, t) {
      host.innerHTML = '<media-player autoplay playsinline><media-provider></media-provider><media-video-layout></media-video-layout></media-player>';
      host.firstChild.src = { src:url, type: t === 'hls' ? 'application/x-mpegurl' : MIME[t] };
      return () => { try{host.firstChild.destroy()}catch(e){} };
    },
    mediachrome(url, t) {
      const tag = t === 'hls' ? 'hls-video' : t === 'dash' ? 'dash-video' : 'video';
      host.innerHTML = `<media-controller><${tag} slot="media" autoplay playsinline crossorigin></${tag}>
        <media-loading-indicator slot="centered-chrome" noautohide></media-loading-indicator>
        <media-rendition-menu hidden anchor="auto"></media-rendition-menu>
        <media-control-bar><media-play-button></media-play-button><media-time-display></media-time-display><media-time-range></media-time-range>
        <media-mute-button></media-mute-button><media-volume-range></media-volume-range><media-rendition-menu-button></media-rendition-menu-button><media-fullscreen-button></media-fullscreen-button></media-control-bar></media-controller>`;
      host.querySelector(tag).src = url;
      return () => {};
    },
    fluid(url, t) {
      const v = mkVideo(); const s = document.createElement('source'); s.src = url; s.type = MIME[t]; v.appendChild(s); host.appendChild(v);
      const p = fluidPlayer(v, { layoutControls:{ fillToContainer:true, autoPlay:true, primaryColor:'#34d399', allowDownload:false, playbackRateEnabled:true, logo:{ imageUrl:null }, htmlOnPauseBlock:{ html:null } },
        vastOptions:{ adList:[] } });
      return () => { try{p.destroy()}catch(e){} };
    },
    openplayer(url, t) {
      const v = mkVideo('op-player__media'); v.id = 'opjs'; v.controls = true;
      const s = document.createElement('source'); s.src = url; s.type = MIME[t]; v.appendChild(s); host.appendChild(v);
      const p = new OpenPlayerJS('opjs', { mode:'responsive', controls:{ layers:{ left:['play','time','volume'], middle:['progress'], right:['settings','fullscreen'] } } });
      p.init();
      setTimeout(() => { try{p.play()}catch(e){} }, 400);
      return () => { try{p.destroy()}catch(e){} };
    }
  };

  function destroyEngine() {
    engineToken++;
    if (engineDestroy) { try { engineDestroy(); } catch(e){} engineDestroy = null; }
    host.innerHTML = '';
    document.querySelector('.player-container').classList.remove('engine-ext');
  }

  async function mountEngine(name, url) {
    const token = ++engineToken, t = srcType(url);
    try {
      await loadLib(name);
      if (token !== engineToken) return;
      video.style.display = 'none';
      document.querySelector('.player-container').classList.add('engine-ext');
      engineDestroy = BUILD[name](url, t);
      showLoading(false); beepConnect();
      const label = engineSel.options[engineSel.selectedIndex].text.split(' —')[0];
      setStatus('● STREAMING — ' + label.toUpperCase(), name.toUpperCase() + ' · ' + t.toUpperCase());
      document.getElementById('liveDot').style.background = '#34d399';
      document.getElementById('liveDot').style.boxShadow = '0 0 8px #34d399';
    } catch(e) { showError('PLAYER LOAD FAILED — ' + engineSel.value.toUpperCase()); }
  }

  function onEngineChange() {
    try { localStorage.setItem('engine', engineSel.value); } catch(e){}
    if (document.getElementById('urlInput').value.trim()) loadStream();
  }

  function loadStream() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { showError('NO URL PROVIDED'); return; }

    destroyInstances();
    hideError();
    showLoading(true);
    isLive = false;

    const lower = url.toLowerCase();
    let streamType = 'DIRECT';

    // --- IFRAME EMBED (playerado, embed pages, etc.) ---
    if (isEmbedUrl(url)) {
      switchToIframe();
      iframePlayer.src = url;
      showLoading(false);
      beepConnect();
      setStatus('● IFRAME EMBED — STREAMING', 'EMBED · PHP/HTML');
      document.getElementById('liveDot').style.background = '#34d399';
      document.getElementById('liveDot').style.boxShadow = '0 0 8px #34d399';
      animateFakeSpectrum();
      return;
    }

    // --- Selected external engine ---
    if (engineSel.value !== 'native') { mountEngine(engineSel.value, url); return; }

    // --- HLS ---
    if (lower.includes('.m3u8') || lower.includes('m3u8')) {
      streamType = 'HLS';
      if (Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          showLoading(false);
          isLive = true;
          video.play();
          initAudio();
          beepConnect();
          setStatus('● STREAMING — HLS ACTIVE', 'HLS · m3u8');
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) showError('HLS ERROR — ' + data.type.toUpperCase());
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
        streamType = 'HLS (NATIVE)';
      } else {
        showError('HLS NOT SUPPORTED');
      }

    // --- MPEG-DASH ---
    } else if (lower.includes('.mpd')) {
      streamType = 'DASH';
      dashInstance = dashjs.MediaPlayer().create();
      dashInstance.initialize(video, url, true);
      dashInstance.on(dashjs.MediaPlayer.events.PLAYBACK_STARTED, () => {
        showLoading(false);
        isLive = true;
        initAudio();
        beepConnect();
        setStatus('● STREAMING — MPEG-DASH ACTIVE', 'DASH · mpd');
      });
      dashInstance.on(dashjs.MediaPlayer.events.ERROR, (e) => {
        showError('DASH ERROR — ' + (e.error?.message || 'UNKNOWN'));
      });

    // --- DIRECT MP4 / WebM / etc. ---
    } else {
      video.src = url;
      video.play();
    }

    setStatus('LOADING — ' + streamType + ' STREAM...', streamType);
  }

  // Video events
  video.addEventListener('playing', () => {
    showLoading(false);
    hideError();
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('liveDot').style.background = '#34d399';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #34d399';
    if (!hlsInstance && !dashInstance) {
      initAudio();
      beepConnect();
      setStatus('● PLAYING — DIRECT STREAM', 'DIRECT · MP4/WebM');
    }
  });

  video.addEventListener('pause', () => {
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('liveDot').style.background = '#ff4d6d';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #ff4d6d';
  });

  video.addEventListener('waiting', () => showLoading(true));
  video.addEventListener('canplay', () => showLoading(false));
  video.addEventListener('error', () => showError('STREAM ERROR — CANNOT LOAD'));

  video.addEventListener('timeupdate', () => {
    if (video.duration && !isNaN(video.duration) && video.duration !== Infinity) {
      const pct = (video.currentTime / video.duration) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('timeDisplay').textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
    } else {
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('timeDisplay').textContent = fmtTime(video.currentTime) + ' / LIVE';
    }
  });

  function fmtTime(s) {
    if (!s || isNaN(s)) return '00:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function seekTo(e) {
    const bar = document.getElementById('progressBar');
    const pct = e.offsetX / bar.offsetWidth;
    if (video.duration && video.duration !== Infinity) {
      video.currentTime = pct * video.duration;
    }
  }

  function togglePlay() {
    if (video.paused) video.play();
    else video.pause();
  }

  function stopStream() {
    destroyInstances();
    iframePlayer.src = '';
    switchToVideo();
    setStatus('STOPPED', '—');
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('timeDisplay').textContent = '00:00 / LIVE';
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('liveDot').style.background = '#ff4d6d';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #ff4d6d';
    stopSpectrum();
    beep(220, 0.15, 'sawtooth');
  }

  function setVolume(v) {
    video.volume = v;
    if (v == 0) { video.muted = true; isMuted = true; }
    else { video.muted = false; isMuted = false; }
    document.getElementById('muteBtn').textContent = v == 0 ? '🔇' : '🔊';
  }

  function toggleMute() {
    isMuted = !isMuted;
    video.muted = isMuted;
    document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
    document.getElementById('volSlider').value = isMuted ? 0 : video.volume || 1;
    beep(isMuted ? 300 : 600, 0.1, 'sine');
  }

  function toggleFullscreen() {
    const el = isIframeMode ? iframePlayer : video;
    if (!document.fullscreenElement) el.requestFullscreen();
    else document.exitFullscreen();
  }

  // Web Audio spectrum
  function initAudio() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      sourceNode = audioCtx.createMediaElementSource(video);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      animateSpectrum();
    } catch(e) {
      animateFakeSpectrum();
    }
  }

  function stopSpectrum() {
    if (animId) cancelAnimationFrame(animId);
    specBars.forEach(b => b.style.height = '3px');
  }

  function animateSpectrum() {
    if (animId) cancelAnimationFrame(animId);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    function draw() {
      analyser.getByteFrequencyData(buf);
      const step = Math.floor(buf.length / NUM_BARS);
      specBars.forEach((b, i) => {
        const val = buf[i * step] || 0;
        const h = Math.max(2, (val / 255) * 32);
        b.style.height = h + 'px';
        const g = Math.floor(100 + (val / 255) * 155);
        b.style.background = `hsl(${255 - (val/255)*70}, 90%, ${58 + (val/255)*14}%)`;
        b.style.boxShadow = 'none';
      });
      animId = requestAnimationFrame(draw);
    }
    draw();
  }

  function animateFakeSpectrum() {
    if (animId) cancelAnimationFrame(animId);
    function draw() {
      if (video.paused) { stopSpectrum(); return; }
      specBars.forEach((b, i) => {
        const h = Math.max(2, Math.random() * 28 + 2);
        b.style.height = h + 'px';
      });
      animId = requestAnimationFrame(draw);
    }
    draw();
  }

  // Beep sound
  function beep(freq, dur, type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
    const ind = document.getElementById('beepIndicator');
    ind.classList.remove('flash');
    void ind.offsetWidth;
    ind.classList.add('flash');
  }

  function beepConnect() {
    beep(880, 0.08, 'sine');
    setTimeout(() => beep(1200, 0.08, 'sine'), 100);
    setTimeout(() => beep(1600, 0.12, 'sine'), 200);
  }

  // Idle spectrum animation
  (function idleAnim() {
    let t = 0;
    function draw() {
      if (!video.paused) { requestAnimationFrame(draw); return; }
      t += 0.05;
      specBars.forEach((b, i) => {
        const h = 2 + Math.sin(t + i * 0.3) * 1.5;
        b.style.height = h + 'px';
        b.style.background = 'var(--accent)';
        b.style.opacity = '0.3';
      });
      requestAnimationFrame(draw);
    }
    draw();
  })();
</script>
</body>
