<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;background:#000}
.stage{position:absolute;inset:0;display:grid;gap:8px;padding:8px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.tile{position:relative;min-height:0;background:#000;border:1px solid #222;border-radius:10px;overflow:hidden;animation:in .4s}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile b{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;padding:2px 8px;border:1px solid #333;background:#000c;border-radius:20px}
@keyframes in{from{opacity:0;transform:scale(.96)}}
[data-l=admin] .tile:not([data-g=admin]),[data-l=user] .tile:not([data-g=guest]),[data-l=both] .tile[data-g=screen],[data-l=screen] .tile:not([data-g=screen]),[data-l=pip] .tile:not([data-g=screen]):not([data-s=a-cam]){display:none}
[data-l=pip] .tile[data-s=a-cam]{position:absolute;right:20px;bottom:20px;width:24%;aspect-ratio:16/9;z-index:3;border-color:#fff}
[data-l=all]{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);grid-template-rows:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;pointer-events:none}
button{position:absolute;z-index:5;background:#000c;color:#fff;border:1px solid #fff;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;transition:background .2s,color .2s}
button:hover{background:#fff;color:#000}
#fs{right:16px;top:16px}
#snd{left:50%;bottom:24px;transform:translateX(-50%)}
@media(max-width:600px){.tile b{display:none}}
</style></head><body>
<div id="wrap">
  <div id="stage" class="stage" data-l="both"></div>
  <div id="empty">Waiting for live feed…</div>
  <button id="fs" aria-label="Full screen">Full Screen</button>
  <button id="snd">Tap to enable sound</button>
</div>
<script>
const $=i=>document.getElementById(i),stage=$('stage'),tiles={};
const q=new URLSearchParams(location.search),room=(q.get('room')||'podcast1').replace(/[^\w-]/g,''),AID=room+'-admin';
const LAYOUTS=['admin','user','both','screen','pip','all'];
let unlocked=false;
const lab=s=>(s[0]=='a'?'ADMIN':'GUEST')+(s.includes('screen')?' · SCREEN':s.endsWith('2')?' · CAM 2':'');
function chk(){$('empty').style.display=[...stage.children].some(t=>t.offsetParent)?'none':'flex'}
function setLayout(l){if(!LAYOUTS.includes(l))return;stage.dataset.l=l;[...stage.children].forEach(t=>{t.style.animation='none';t.offsetWidth;t.style.animation=''});chk()}
function rmSlot(s){tiles[s]&&tiles[s].remove();delete tiles[s];chk()}
function addSlot(s,st){
  rmSlot(s);const a=!st.getVideoTracks().length,m=document.createElement(a?'audio':'video');
  m.srcObject=st;m.autoplay=true;m.playsInline=true;m.muted=!unlocked;
  if(a){document.body.append(m);tiles[s]=m}
  else{const t=document.createElement('div');t.className='tile';t.dataset.s=s;
    t.dataset.g=s.includes('screen')?'screen':s[0]=='a'?'admin':'guest';
    t.innerHTML='<b>'+lab(s)+'</b>';t.prepend(m);stage.append(t);tiles[s]=t}
  m.play().catch(()=>{});chk()}

/* browsers block unmuted autoplay: one tap unlocks audio for all feeds */
$('snd').onclick=()=>{unlocked=true;$('snd').style.display='none';
  document.querySelectorAll('video,audio').forEach(m=>{m.muted=false;m.play().catch(()=>{})})};

$('fs').onclick=()=>{const d=document,e=$('wrap');
  if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  else(e.requestFullscreen||e.webkitRequestFullscreen).call(e)};

/* receive-only: the viewer never captures media and never sends data */
const peer=new Peer();let timer=null;
function retry(){clearTimeout(timer);timer=setTimeout(join,3000)}
function join(){
  if(peer.destroyed||peer.disconnected)return retry();
  const c=peer.connect(AID,{metadata:{role:'viewer'}});
  c.on('data',d=>{if(d&&d.t=='layout')setLayout(d.v)});
  c.on('close',()=>{Object.keys(tiles).forEach(rmSlot);retry()});
}
peer.on('open',join);
peer.on('disconnected',()=>peer.reconnect());
peer.on('error',e=>{if(e.type=='peer-unavailable')retry()});
peer.on('call',c=>{
  const s=c.metadata&&c.metadata.slot;if(!s)return;c.answer();   /* answer without any stream */
  c.on('stream',st=>addSlot(s,st));
  c.on('close',()=>rmSlot(s));
});
</script></body></html>
