<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest · Podcast</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #222;font-size:12px;color:#8a8a8a}
header b{color:#fff;font-size:14px}
.stage{overflow:auto;padding:8px;display:grid;gap:8px;align-content:start;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tile{position:relative;aspect-ratio:16/9;background:#000;border:1px solid #222;border-radius:10px;overflow:hidden;animation:in .35s}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile b{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;padding:2px 8px;border:1px solid #333;background:#000c;border-radius:20px}
@keyframes in{from{opacity:0;transform:scale(.96)}}
#empty{padding:40px;color:#555;text-align:center;grid-column:1/-1}
aside{border-left:1px solid #222;display:flex;flex-direction:column;padding:14px;min-height:0}
h3{font-size:12px;color:#8a8a8a;font-weight:600;margin-bottom:10px}
#log{flex:1;overflow:auto;margin-bottom:8px;font-size:13px}#log div{padding:3px 0;border-bottom:1px solid #111}
.row{display:flex;gap:8px}
button,input{background:#000;color:#fff;border:1px solid #333;border-radius:8px;padding:10px 14px;font:inherit}
button{cursor:pointer}button:hover{border-color:#fff}button.on{background:#fff;color:#000}
input{width:100%;outline:none}input:focus{border-color:#fff}
.bar{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px;border-top:1px solid #222}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 240px;height:100%}header,.bar{grid-column:1}aside{border-left:0;border-top:1px solid #222}}
</style></head><body>
<div class="app">
  <header><b>Podcast Guest</b><span id="st">Connecting…</span></header>
  <div class="stage" id="stage"><div id="empty">Turn on your camera or microphone below. The host's feed will appear here.</div></div>
  <aside><h3>Chat</h3><div id="log"></div>
    <div class="row"><input id="msg" placeholder="Message host…" autocomplete="off"><button id="snd">Send</button></div></aside>
  <div class="bar">
    <button id="bF">Front Camera</button><button id="bB">Back Camera</button><button id="bD">Dual Camera</button>
    <button id="bS">Screen Share</button><button id="bM">Microphone</button>
  </div>
</div>
<script>
const $=i=>document.getElementById(i),stage=$('stage'),tiles={};
const q=new URLSearchParams(location.search),room=(q.get('room')||'podcast1').replace(/[^\w-]/g,''),AID=room+'-admin',UID=room+'-user';
const lab=s=>s[0]=='a'?'ADMIN'+(s.includes('screen')?' · SCREEN':''):'YOU'+(s.includes('screen')?' · SCREEN':s.endsWith('2')?' · CAM 2':'');
function chk(){$('empty').style.display=Object.values(tiles).some(t=>t.className=='tile')?'none':'block'}
function rmSlot(s){tiles[s]&&tiles[s].remove();delete tiles[s];chk()}
function addSlot(s,st,mute){
  rmSlot(s);const a=!st.getVideoTracks().length,m=document.createElement(a?'audio':'video');
  m.srcObject=st;m.autoplay=true;m.playsInline=true;m.muted=mute;
  if(a){document.body.append(m);tiles[s]=m}
  else{const t=document.createElement('div');t.className='tile';t.innerHTML='<b>'+lab(s)+'</b>';t.prepend(m);stage.append(t);tiles[s]=t}
  m.play().catch(()=>{});chk()}
document.addEventListener('click',()=>document.querySelectorAll('video,audio').forEach(m=>m.play().catch(()=>{})));

let conn=null;const src={},face={},calls={},rc={};
const status=t=>$('st').textContent=t;
const peer=new Peer(UID);
peer.on('open',connect);
peer.on('disconnected',()=>peer.reconnect());
peer.on('error',e=>{
  if(e.type=='peer-unavailable'){status('Waiting for host…');setTimeout(connect,2500)}
  else status(e.type=='unavailable-id'?'Guest link already open elsewhere':'Error: '+e.type)});

function connect(){
  if(conn&&conn.open)return;
  conn=peer.connect(AID,{metadata:{role:'user'}});const c=conn;
  c.on('open',()=>{status('Connected to host');Object.keys(src).forEach(k=>send(k,src[k]))});
  c.on('data',d=>{if(d&&d.t=='chat')log('Host',d.v)});
  c.on('close',()=>{status('Reconnecting…');setTimeout(connect,2500)});
}
function send(k,st){
  if(!conn||!conn.open)return;
  try{calls[k]&&calls[k].close()}catch(e){}
  calls[k]=peer.call(AID,st,{metadata:{slot:k}});
}
/* media coming from the host */
peer.on('call',c=>{
  const s=c.metadata&&c.metadata.slot;if(!s)return;c.answer();rc[s]=c;
  c.on('stream',st=>addSlot(s,st,false));
  c.on('close',()=>{if(rc[s]===c){delete rc[s];rmSlot(s)}});
});

/* local sources: cam (front/back), cam2 (dual's back camera), screen, mic */
async function start(k,f){
  stop(k);let st;
  try{st=k=='screen'?await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}):
    await navigator.mediaDevices.getUserMedia(k=='mic'?{audio:{echoCancellation:true,noiseSuppression:true}}:{video:{facingMode:{ideal:f},width:{ideal:1280}}})}
  catch(e){status(k+': '+e.message);return false}
  src[k]=st;face[k]=f;if(k!='mic')addSlot('me-'+k,st,true);send(k,st);
  st.getTracks()[0].onended=()=>stop(k);ui();return true;
}
function stop(k){
  const st=src[k];if(!st)return;st.getTracks().forEach(t=>t.stop());delete src[k];
  try{calls[k]&&calls[k].close()}catch(e){}delete calls[k];rmSlot('me-'+k);ui();
}
function ui(){
  const on=(i,v)=>$(i).classList.toggle('on',!!v);
  on('bF',src.cam&&face.cam=='user'&&!src.cam2);on('bB',src.cam&&face.cam=='environment'&&!src.cam2);
  on('bD',src.cam2);on('bS',src.screen);on('bM',src.mic);
}
const camBtn=f=>()=>{if(src.cam&&face.cam==f&&!src.cam2)stop('cam');else{stop('cam2');start('cam',f)}};
$('bF').onclick=camBtn('user');$('bB').onclick=camBtn('environment');
$('bD').onclick=async()=>{
  if(src.cam2){stop('cam2');stop('cam');return}
  await start('cam','user');
  if(!await start('cam2','environment'))status('This device cannot run two cameras at once');
};
$('bS').onclick=()=>src.screen?stop('screen'):start('screen');
$('bM').onclick=()=>src.mic?stop('mic'):start('mic');

function log(w,t){const d=document.createElement('div');d.textContent=w+': '+t;$('log').append(d);$('log').scrollTop=1e9}
function sendMsg(){const v=$('msg').value.trim();if(!v||!conn||!conn.open)return;conn.send({t:'chat',v});log('You',v);$('msg').value=''}
$('snd').onclick=sendMsg;$('msg').onkeydown=e=>{if(e.key=='Enter')sendMsg()};
</script></body></html>
